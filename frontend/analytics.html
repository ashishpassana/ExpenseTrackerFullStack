<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-slate-100 text-slate-900">

  <nav class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
    <div class="mx-auto max-w-7xl px-6 py-4 flex items-center justify-between">

      <h1 class="text-xl font-bold text-blue-700">
        Expense Tracker
      </h1>

      <div class="flex gap-6 text-sm font-medium">
        <a href="index.html" class="text-slate-600 hover:text-blue-700">
          Dashboard
        </a>

        <a href="analytics.html" class="text-blue-700">
          Analytics
        </a>

        <button id="logoutBtn" class="text-red-600 font-semibold">
          Logout
        </button>

      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-7xl p-6">

    <div class="mb-8">
      <h1 class="text-4xl font-bold">
        Analytics
      </h1>

      <p class="text-slate-500 mt-2">
        Analyze your spending trends and category breakdown.
      </p>
    </div>

    <section class="grid gap-4 md:grid-cols-4 mb-8">

      <div class="bg-white rounded-xl p-5 shadow-sm">
        <p class="text-slate-500">Highest Expense</p>
        <h2 id="highestExpense" class="text-3xl font-bold mt-2">
          ₹0
        </h2>
      </div>

      <div class="bg-white rounded-xl p-5 shadow-sm">
        <p class="text-slate-500">Average Monthly Spend</p>
        <h2  id="averageMonthly" class="text-3xl font-bold mt-2">
          ₹0
        </h2>
      </div>

      <div class="bg-white rounded-xl p-5 shadow-sm">
        <p class="text-slate-500">Most Used Category</p>
        <h2 id="mostCategory" class="text-3xl font-bold mt-2">
          -
        </h2>
      </div>

      <div class="bg-white rounded-xl p-5 shadow-sm">
        <p class="text-slate-500">Total Categories</p>
        <h2 id="totalCategories" class="text-3xl font-bold mt-2">
          0
        </h2>
      </div>

    </section>

    <section class="grid gap-6 lg:grid-cols-2">

      <div class="bg-white rounded-xl p-5 shadow-sm">
        <h2 class="text-xl font-semibold mb-4">
          Monthly Spending Trend
        </h2>

        <canvas id="monthlyChart"></canvas>
      </div>

      <div class="bg-white rounded-xl p-5 shadow-sm">
        <h2 class="text-xl font-semibold mb-4">
          Category Distribution
        </h2>

        <canvas id="categoryChart"></canvas>
      </div>

    </section>

  </main>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/analytics.js"></script>

</body>
</html>
